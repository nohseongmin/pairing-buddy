<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>질문 폼 기본 제출 방지 회귀 확인</title>
</head>
<body>
<p>저장소 루트에서 정적 서버를 띄운 뒤 이 파일을 열어 주세요.</p>
<p id="status" role="status">확인 중입니다.</p>
<iframe id="app" src="../index.html" width="390" height="820" title="페어링 버디"></iframe>
<script>
"use strict";

const frame = document.querySelector('#app');

function assert(condition, message){
  if (!condition) throw new Error(message);
}

frame.addEventListener('load', () => {
  try{
    const app = frame.contentWindow, doc = app.document;
    const quiz = doc.querySelector('#quiz');
    const inputs = quiz.querySelectorAll('input[id$="a"]');
    const button = doc.querySelector('#btn-result');

    inputs.forEach((input, i) => { if (i < 3) input.click(); });
    // Enter로 발생하는 기본 제출을 취소해야 답변이 쿼리로 전송되거나 페이지가 다시 열리지 않는다.
    const partialSubmit = new app.SubmitEvent('submit', {bubbles:true, cancelable:true});
    assert(!quiz.dispatchEvent(partialSubmit), '일부 답변만 선택해도 기본 제출을 취소해야 합니다.');
    assert(quiz.querySelectorAll('input:checked').length === 3, '제출 후 선택한 답변을 유지해야 합니다.');
    assert(doc.querySelector('#progcnt').textContent === '3/5', '제출 후 응답 진행률을 유지해야 합니다.');
    assert(button.disabled, '미완료 상태에서는 결과 버튼이 비활성화되어야 합니다.');

    inputs.forEach(input => input.click());
    const completeSubmit = new app.SubmitEvent('submit', {bubbles:true, cancelable:true});
    assert(!quiz.dispatchEvent(completeSubmit), '답변을 완료해도 기본 제출을 취소해야 합니다.');
    assert(quiz.querySelectorAll('input:checked').length === 5, '완료된 답변을 유지해야 합니다.');
    assert(doc.querySelector('#progcnt').textContent === '5/5', '완료된 응답 진행률을 유지해야 합니다.');
    assert(doc.querySelector('#s-quiz').classList.contains('active'), '기본 제출 후 질문 화면을 유지해야 합니다.');
    assert(app.location.hash === '', '기본 제출이 결과 주소를 바꾸면 안 됩니다.');
    assert(!button.disabled, '완료 상태에서는 결과 버튼이 활성화되어야 합니다.');

    button.click();
    assert(app.location.hash === '#SRWHX', '결과 버튼으로 선택한 답변의 결과를 볼 수 있어야 합니다.');
    assert(doc.querySelector('#s-result').classList.contains('active'), '결과 버튼으로 결과 화면으로 이동해야 합니다.');
    document.querySelector('#status').textContent = '통과했습니다.';
  }catch(error){
    document.querySelector('#status').textContent = '실패했습니다: ' + error.message;
    throw error;
  }
}, {once:true});
</script>
</body>
</html>
