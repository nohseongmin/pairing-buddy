<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>브라우저 답변 복원 회귀 확인</title>
</head>
<body>
<p>저장소 루트에서 정적 서버를 띄운 뒤 이 파일을 열어 주세요.</p>
<p id="status" role="status">확인 중입니다.</p>
<iframe id="app" src="../index.html" width="390" height="820" title="페어링 버디"></iframe>
<script>
"use strict";

const frame = document.querySelector('#app');

function assert(condition, message){
  if (!condition) throw new Error(message);
}

frame.addEventListener('load', async () => {
  try{
    const app = frame.contentWindow, doc = app.document;
    const inputs = doc.querySelectorAll('input[id$="a"]');
    const progress = doc.querySelector('#progbar');
    const button = doc.querySelector('#btn-result');

    // pageshow 뒤에 change 이벤트 없이 답변이 복원되는 경우를 확인한다.
    app.dispatchEvent(new app.PageTransitionEvent('pageshow'));
    inputs.forEach((input, i) => { input.checked = i < 3; });
    await new Promise(resolve => app.setTimeout(resolve, 0));

    assert(doc.querySelector('#progcnt').textContent === '3/5', '복원된 답변 수를 표시해야 합니다.');
    assert(progress.getAttribute('aria-valuenow') === '3', '응답 진행률도 복원된 답변 수와 같아야 합니다.');
    assert(progress.querySelector('i').style.width === '60%', '진행 막대가 복원된 답변 수를 반영해야 합니다.');
    assert(button.disabled, '일부 답변만 복원되면 결과 버튼이 비활성화되어야 합니다.');

    app.dispatchEvent(new app.PageTransitionEvent('pageshow', {persisted:true}));
    inputs.forEach(input => { input.checked = true; });
    await new Promise(resolve => app.setTimeout(resolve, 0));

    assert(doc.querySelector('#progcnt').textContent === '5/5', '모든 답변이 복원되면 완료 상태를 표시해야 합니다.');
    assert(!button.disabled, '모든 답변이 복원되면 결과 버튼이 활성화되어야 합니다.');
    button.click();
    assert(app.location.hash === '#SRWHX', '복원된 답변으로 결과를 볼 수 있어야 합니다.');
    assert(doc.querySelector('#s-result').classList.contains('active'), '복원된 답변의 결과 화면으로 이동해야 합니다.');
    document.querySelector('#status').textContent = '통과했습니다.';
  }catch(error){
    document.querySelector('#status').textContent = '실패했습니다: ' + error.message;
    throw error;
  }
}, {once:true});
</script>
</body>
</html>
