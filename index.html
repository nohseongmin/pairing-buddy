<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="다섯 번만 고르면 오늘의 안주와 어울리는 술을 찾아 주는 음식 취향 테스트.">
<meta name="theme-color" content="#e05b2b">
<title>오늘 뭐 먹지? — 페어링 버디</title>
<style>
  :root{
    --bg:#ffffff; --page:#f4efe9; --card:#ffffff; --line:#ebe0d6; --soft:#faf4ee;
    --text:#231a15; --muted:#8b7a6e;
    --brand:#e05b2b; --brand-d:#c2461a; --brand-bg:#fdeee6;
    --barh:78px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--page); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",
                "Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    display:flex; justify-content:center; align-items:center;
    -webkit-text-size-adjust:100%;
  }
  /* ── 껍데기: 모바일은 화면을 꽉 채우고, 데스크톱에서만 폰 프레임 ── */
  .phone{
    width:100%; background:var(--bg);
    height:100vh; height:100dvh;          /* dvh 미지원 브라우저는 vh로 떨어진다 */
    display:flex; flex-direction:column; overflow:hidden; position:relative;
  }
  .status{display:none;}
  @media (min-width:640px){
    body{padding:24px;}
    .phone{
      width:390px;
      height:min(820px, calc(100vh - 48px));
      height:min(820px, calc(100dvh - 48px));
      border-radius:38px; border:1px solid #e6dbd0;
      box-shadow:0 16px 44px rgba(120,60,20,.16);
    }
    .status{
      display:flex; flex:none; height:36px; align-items:center; justify-content:space-between;
      padding:10px 24px 0; font-size:13px; font-weight:600;
    }
    .status .sig{display:flex; gap:6px; align-items:center;}
  }
  /* ── 화면 전환 ── */
  .screen{display:none; flex:1; min-height:0; flex-direction:column;
          padding-top:env(safe-area-inset-top,0px);}
  .screen.active{display:flex;}
  .screen:focus{outline:none;}
  .scroll{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;
          scrollbar-width:none; padding:0 18px 22px;}
  .scroll::-webkit-scrollbar{display:none;}
  .ico{width:1em; height:1em; display:block; fill:none; stroke:currentColor;
       stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
  h1{font-size:22px; font-weight:800; letter-spacing:-.6px;}
  .sub{color:var(--muted); font-size:13.5px; margin-top:3px; line-height:1.5;}

  /* ── 헤더 + 진행바 ── */
  .head{flex:none; padding:12px 18px 10px; border-bottom:1px solid var(--line); background:var(--bg);}
  .headrow{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .headrow .cnt{flex:none; font-size:12px; font-weight:800; color:var(--brand);
                font-variant-numeric:tabular-nums;}
  .head .sub{font-size:12.5px; margin-top:2px;}
  .head .bar{height:6px; margin-top:8px; background:var(--soft); border-radius:6px; overflow:hidden;}
  .head .bar i{display:block; height:100%; width:0; background:var(--brand);
               border-radius:6px; transition:width .25s;}

  /* ── 질문 : 스크롤 없이 남은 높이를 5문항이 나눠 채운다 ── */
  #quiz{flex:1; min-height:0; overflow:hidden; padding:11px 18px 3px;
        display:flex; flex-direction:column; gap:9px;}
  .q{flex:1 1 0; min-height:0; border:none; display:flex; flex-direction:column;}
  .q legend{flex:none; display:block; font-size:14.5px; font-weight:700;
            letter-spacing:-.3px; margin-bottom:6px;}
  .q legend .qn{display:inline-block; min-width:24px; color:var(--brand); font-weight:800;}
  .opts{flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .sr{position:absolute; opacity:0; width:1px; height:1px; pointer-events:none;}
  .opt{display:flex; flex-direction:column; justify-content:center; gap:2px;
       padding:8px 12px; overflow:hidden;
       background:var(--card); border:1.5px solid var(--line); border-radius:14px;
       cursor:pointer; transition:border-color .15s, background .15s, transform .1s;}
  .opt:active{transform:scale(.98);}
  .opt .ot{font-size:14px; font-weight:700; letter-spacing:-.3px;}
  .opt .os{font-size:11px; color:var(--muted); line-height:1.4;}
  .sr:checked + .opt{border-color:var(--brand); background:var(--brand-bg);}
  .sr:checked + .opt .ot{color:var(--brand-d);}
  .sr:focus-visible + .opt{outline:2px solid var(--brand); outline-offset:2px;}
  /* 세로가 아주 짧으면 설명 줄부터 접어 스크롤을 막는다 */
  @media (max-height:660px){ .opt .os{display:none;} }

  /* ── 하단 버튼 ── */
  .bar-btm{flex:none; padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));
           border-top:1px solid var(--line); background:var(--bg);}
  .cta{display:flex; align-items:center; justify-content:center; gap:7px; width:100%;
       padding:14px; background:var(--brand); color:#fff; font-weight:800;
       border:none; border-radius:15px; font-size:15.5px; cursor:pointer; font-family:inherit;
       transition:background .15s;}
  .cta:active{background:var(--brand-d);}
  .cta:disabled{background:#e3d8ce; color:#9a8879; cursor:default;}
  .cta .ico{font-size:18px;}
  .cta.ghost{background:none; color:var(--muted); border:1.5px solid var(--line); font-weight:700;}
  .cta.ghost:active{background:var(--soft);}
  .btnrow{display:flex; gap:9px; margin-top:18px;}

  /* ── 결과 ── */
  .codechips{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; margin-top:16px;}
  .codechips span{font-size:11.5px; font-weight:700; padding:5px 11px; border-radius:20px;
                  background:var(--brand-bg); color:var(--brand-d);}
  .hero{display:flex; flex-direction:column; align-items:center; text-align:center; margin-top:14px;}
  .hero .disc{width:112px; height:112px; border-radius:50%; display:grid; place-items:center;
              font-size:56px; background:radial-gradient(circle at 32% 28%,#fff3ea,#fbdcc9);
              border:1px solid #f3ddcc;}
  .hero .lab{margin-top:14px; font-size:12px; font-weight:800; letter-spacing:1px; color:var(--brand);}
  .hero h2{font-size:29px; font-weight:800; letter-spacing:-1px; margin-top:4px;}
  .hero .nick{margin-top:7px; font-size:13.5px; font-weight:700; color:var(--muted);}
  .tags{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:12px;}
  .tags span{font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:8px;
             background:var(--soft); color:var(--muted); border:1px solid var(--line);}
  .why{margin-top:14px; padding:14px 15px; background:var(--soft); border-radius:14px;
       font-size:13.5px; line-height:1.7; color:#4b3d34;}

  .seclabel{display:flex; align-items:center; gap:7px; margin:24px 0 10px;
            font-size:14px; font-weight:800;}
  .seclabel .ico{color:var(--brand); font-size:17px;}
  .pairwrap{background:var(--card); border:1px solid var(--line); border-radius:18px;
            overflow:hidden; box-shadow:0 6px 18px rgba(120,60,20,.06);}
  .pairtop{display:flex; gap:13px; padding:13px;}
  /* 사진이 없거나 로드에 실패하면 뒤의 이모지가 그대로 보인다 */
  .ph{position:relative; flex:none; width:96px; height:96px; border-radius:13px;
      background:var(--soft); overflow:hidden; display:grid; place-items:center;}
  .ph .emo{font-size:36px; line-height:1; opacity:.55;}
  .ph img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;
          -webkit-user-drag:none; user-select:none;}
  .ph img[hidden]{display:none;}
  .pairinfo{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center;}
  .pairinfo .pn{font-size:17px; font-weight:800; letter-spacing:-.4px;}
  .pairinfo .pt{font-size:12px; color:var(--muted); margin-top:2px;}
  .matchbar{display:flex; align-items:center; gap:9px; margin-top:10px; font-size:12px; color:var(--muted);}
  .matchbar .bar{flex:1; height:8px; background:var(--soft); border-radius:6px; overflow:hidden;}
  .matchbar .bar i{display:block; height:100%; background:var(--brand); border-radius:6px;}
  .pct{font-weight:800; color:var(--brand); font-size:13.5px; font-variant-numeric:tabular-nums;}
  .pairwhy{padding:0 15px 13px; font-size:13px; line-height:1.65; color:#4b3d34;}
  .softline{display:flex; align-items:center; gap:8px; padding:11px 15px;
            border-top:1px dashed var(--line); font-size:12.5px; color:var(--muted);}
  .softline b{color:var(--text); font-weight:700;}
  .credline{padding:0 15px 12px; font-size:10.5px; color:#a2938a; line-height:1.5; overflow-wrap:anywhere;}
  .credline a{color:#a2938a;}

  /* ── 근처에서 먹기 (구글 지도 검색 링크) ── */
  .store{display:flex; align-items:center; gap:11px; padding:11px 12px; margin-bottom:8px;
         background:var(--card); border:1px solid var(--line); border-radius:14px;
         text-decoration:none; color:inherit;}
  .store:active{background:var(--soft);}
  .store .ic{flex:none; width:38px; height:38px; border-radius:10px; background:var(--brand-bg);
             color:var(--brand); display:grid; place-items:center; font-size:18px;}
  .store .si{flex:1; min-width:0;}
  .store .nm{display:block; font-size:14px; font-weight:700;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .store .ds{display:block; font-size:11.5px; color:var(--muted); margin-top:2px;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .store .go{flex:none; color:var(--brand); font-size:12px; font-weight:800;}

  .alts{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .alt{display:flex; align-items:center; gap:9px; padding:11px 12px; background:var(--card);
       border:1px solid var(--line); border-radius:14px; text-align:left;
       font-family:inherit; font-size:13.5px; font-weight:700; color:inherit; cursor:pointer;}
  .alt:active{background:var(--soft);}
  .alt .ae{font-size:21px; flex:none;}
  .alt .an{min-width:0; overflow:hidden;}
  .alt .an b{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .alt .as{display:block; font-size:10.5px; font-weight:600; color:var(--muted); margin-top:1px;}

  .note{margin-top:20px; font-size:11px; color:#a2938a; line-height:1.7;}
  .note a{color:var(--brand); text-decoration:none;}
  .note a:hover{text-decoration:underline;}

  /* ── 토스트 ── */
  .toast{position:absolute; left:50%; bottom:calc(var(--barh) + 18px);
         transform:translate(-50%,8px); background:rgba(35,26,21,.92); color:#fff;
         font-size:13px; padding:10px 16px; border-radius:10px; opacity:0;
         pointer-events:none; transition:opacity .2s, transform .2s;
         max-width:80%; text-align:center; z-index:5;}
  .toast.show{opacity:1; transform:translate(-50%,0);}

  /* ── 세로가 짧은 기기(SE 등)에선 여백을 줄인다 ── */
  @media (max-height:700px){
    h1{font-size:19px;}
    .head{padding:10px 16px 8px;}
    .scroll{padding:0 16px 18px;}
    #quiz{padding:8px 16px 2px; gap:7px;}
    .q legend{font-size:13.5px; margin-bottom:4px;}
    .opt{padding:7px 10px;}
    .hero .disc{width:92px; height:92px; font-size:46px;}
    .hero h2{font-size:25px;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition-duration:.01ms !important;} }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5 13.7 8 18 9.7 13.7 11.4 12 16l-1.7-4.6L6 9.7 10.3 8 12 3.5zM18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2z"/></symbol>
  <symbol id="i-glass" viewBox="0 0 24 24"><path d="M7.5 3h9l-1 7.2a3.6 3.6 0 0 1-7 0L7.5 3zM12 14v6M8.5 20h7"/></symbol>
  <symbol id="i-plate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="4.6"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-5.7 7-11a7 7 0 1 0-14 0c0 5.3 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></symbol>
  <symbol id="i-again" viewBox="0 0 24 24"><path d="M20 11.5A8 8 0 1 1 17.7 6M20 4v5h-5"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.4"/><path d="M15.5 5.5H6.9A2.4 2.4 0 0 0 4.5 7.9v8.6"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2.8 8.6a14 14 0 0 1 18.4 0M6 12.2a9 9 0 0 1 12 0M9.2 15.7a4.4 4.4 0 0 1 5.6 0"/><circle cx="12" cy="19.2" r=".9" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-battery" viewBox="0 0 24 24"><rect x="2.5" y="7.5" width="16" height="9" rx="2.4"/><path d="M21.2 10.6v2.8"/><rect x="4.8" y="9.8" width="8" height="4.4" rx="1" fill="currentColor" stroke="none"/></symbol>
</defs></svg>

<div class="phone">
  <div class="status">
    <span>9:41</span>
    <span class="sig">
      <svg class="ico" style="font-size:15px"><use href="#i-wifi"/></svg>
      <svg class="ico" style="font-size:17px"><use href="#i-battery"/></svg>
    </span>
  </div>

  <!-- ===== 1 : 취향 테스트 ===== -->
  <section class="screen active" id="s-quiz" aria-labelledby="quiz-title">
    <div class="head">
      <div class="headrow">
        <h1 id="quiz-title">오늘 뭐 먹지?</h1>
        <span class="cnt" id="progcnt">0/5</span>
      </div>
      <p class="sub">다섯 번만 고르면 오늘의 안주와 어울리는 술을 찾아 드려요</p>
      <div class="bar" id="progbar" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" aria-label="응답 진행률"><i></i></div>
    </div>
    <form id="quiz"></form>
    <div class="bar-btm">
      <button class="cta" id="btn-result" type="button" disabled>
        결과 보기 <svg class="ico"><use href="#i-spark"/></svg></button>
    </div>
  </section>

  <!-- ===== 2 : 결과 ===== -->
  <section class="screen" id="s-result" aria-labelledby="res-title" tabindex="-1">
    <div class="scroll" id="result"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
"use strict";

/* ─────────── 질문 : 앞 4개가 음식 유형(16가지), 마지막 1개가 술 세기 ─────────── */
const QUESTIONS = [
  { q:'오늘 혀는 어느 쪽인가요?',
    a:{v:'S', t:'화끈하게 매운 거',   s:'땀 좀 흘려야 먹은 것 같다'},
    b:{v:'M', t:'맵지 않고 순한 거',   s:'재료 맛이 그대로 느껴지는 게 좋다'} },
  { q:'입에 남는 맛은?',
    a:{v:'R', t:'기름지고 진한 거',    s:'느끼한 게 곧 맛이다'},
    b:{v:'L', t:'담백하고 깔끔한 거',  s:'속 편한 쪽으로 간다'} },
  { q:'국물, 있어야 하나요?',
    a:{v:'W', t:'뜨끈한 국물 필수',    s:'숟가락부터 챙긴다'},
    b:{v:'D', t:'국물 없이 마른 걸로', s:'젓가락만 있으면 된다'} },
  { q:'오늘의 양은?',
    a:{v:'H', t:'든든하게 한 상',      s:'이걸로 저녁까지 해결'},
    b:{v:'B', t:'가볍게 집어먹기',     s:'배부르면 재미없다'} },
  { q:'같이 마실 건?',
    a:{v:'X', t:'진하게 한 잔',        s:'잔에 따라 천천히 마시는 쪽'},
    b:{v:'Y', t:'시원하게 벌컥',       s:'차갑게 들이켜는 쪽'} },
];

/* ─────────── 술 : images/ 의 사진과 1:1로 붙는다 ─────────── */
const DRINK = {
  makgeolli:{n:'생막걸리', t:'전통주 · 탁주 · 6%', emo:'🍶', img:'images/sool-makgeolli.jpg', alt:'국자로 따르는 막걸리',
    c:{t:'Geumjeongsanseong Makgeolli 10', a:'Republic of Korea (KOCIS)', l:'CC BY-SA 2.0', lu:'https://creativecommons.org/licenses/by-sa/2.0', p:'https://commons.wikimedia.org/wiki/File:Geumjeongsanseong_Makgeolli_10.jpg'}},
  sake:{n:'준마이 사케', t:'일본 청주 · 니혼슈 · 15%', emo:'🍶', img:'images/sool-sake.jpg', alt:'유리잔에 담긴 사케',
    c:{t:'Sake 20210723 170552', a:'Ka23 13', l:'CC BY-SA 4.0', lu:'https://creativecommons.org/licenses/by-sa/4.0', p:'https://commons.wikimedia.org/wiki/File:Sake_20210723_170552.jpg'}},
  beer:{n:'크래프트 IPA', t:'수제맥주 · 페일 에일 · 6.5%', emo:'🍺', img:'images/sool-ipa.jpg', alt:'잔에 담긴 IPA 맥주와 캔',
    c:{t:'Brouwerij Kees Barrel Project India Pale Ale 2023', a:'Mitsjol', l:'CC BY 4.0', lu:'https://creativecommons.org/licenses/by/4.0', p:'https://commons.wikimedia.org/wiki/File:Brouwerij_Kees_Barrel_Project_India_Pale_Ale_2023.jpg'}},
  highball:{n:'위스키 하이볼', t:'하이볼 · 위스키 소다 · 7%', emo:'🥃', img:'images/sool-highball.jpg', alt:'얼음을 넣은 위스키 하이볼',
    c:{t:'Glass of Scotch and soda', a:'DoubleGrazing', l:'CC BY-SA 4.0', lu:'https://creativecommons.org/licenses/by-sa/4.0', p:'https://commons.wikimedia.org/wiki/File:Glass_of_Scotch_and_soda.jpg'}},
  soju:{n:'증류식 소주', t:'전통주 · 증류주 · 25%', emo:'🍾', img:'images/sool-soju.jpg', alt:'안동소주 도자기 병',
    c:{t:'Korean distilled liquor-Andong soju-01', a:'Matt and Nayoung Wilson', l:'CC BY 2.0', lu:'https://creativecommons.org/licenses/by/2.0', p:'https://commons.wikimedia.org/wiki/File:Korean_distilled_liquor-Andong_soju-01.jpg'}},
  wine:{n:'레드와인', t:'와인 · 카베르네 계열 · 13%', emo:'🍷', img:'images/sool-wine.jpg', alt:'레드와인 병과 잔',
    c:{t:'Bottle and glass of red wine', a:'congerdesign', l:'CC0', lu:'https://creativecommons.org/publicdomain/zero/1.0/', p:'https://commons.wikimedia.org/wiki/File:Bottle_and_glass_of_red_wine.jpg'}},
};

/* ─────────── 음식 16종 : 앞 4문항 조합(매운맛·기름기·국물·양)이 그대로 키가 된다 ───────────
   x = '진하게 한 잔'(soju·sake·wine), y = '시원하게 벌컥'(beer·highball·makgeolli) 로 갈린다 */
const FOOD = {
  SRWH:{n:'감자탕', emo:'🍲', nick:'뼈째 우린 얼큰파', tags:['얼큰 국물','고기 듬뿍','해장 가능'],
    d:'진하게 우린 국물에 살코기를 발라 먹는 맛. 추운 날 밤 열두 시에도 문이 열려 있는 든든함이 있어요.',

/* ─────────── 유틸 ─────────── */
const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 사진이 없어도 깨진 아이콘 대신 뒤의 이모지가 남도록 (load 에러는 버블링하지 않아 캡처로 받는다) */
document.addEventListener('error', e => {
  if (e.target.tagName === 'IMG') e.target.hidden = true;
}, true);

let toastTimer;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
}

/* ─────────── 질문 그리기 ─────────── */
const opt = (i, side, o) => `
  <input class="sr" type="radio" name="q${i}" id="q${i}${side}" value="${o.v}">
  <label class="opt" for="q${i}${side}">
    <span class="ot">${esc(o.t)}</span>
    <span class="os">${esc(o.s)}</span>
  </label>`;

$('#quiz').innerHTML = QUESTIONS.map((q, i) => `
  <fieldset class="q">
    <legend><span class="qn">Q${i + 1}</span>${esc(q.q)}</legend>
    <div class="opts">${opt(i, 'a', q.a)}${opt(i, 'b', q.b)}</div>
  </fieldset>`).join('');

function answers(){
  return QUESTIONS.map((_, i) => {
    const el = $(`input[name="q${i}"]:checked`);
    return el ? el.value : null;
  });
}

function refresh(){
  const done = answers().filter(Boolean).length;
  $('#progbar').querySelector('i').style.width = (done / QUESTIONS.length * 100) + '%';
  $('#progbar').setAttribute('aria-valuenow', String(done));
  $('#progcnt').textContent = done + '/' + QUESTIONS.length;
  $('#btn-result').disabled = done < QUESTIONS.length;
}
$('#quiz').addEventListener('change', refresh);

/* ─────────── 결과 ─────────── */
/* 같은 축 하나만 뒤집으면 '비슷한데 조금 다른' 음식이 나온다 */
const flip = (code, i, pair) =>
  code.slice(0, i) + (code[i] === pair[0] ? pair[1] : pair[0]) + code.slice(i + 1);

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  const active = $('.screen.active .scroll');
  if (active) active.scrollTop = 0;
}

function drinkCard(key, pct, why, soft){
  const d = DRINK[key];
  return `
    <div class="pairwrap">
      <div class="pairtop">
        <div class="ph"><span class="emo" aria-hidden="true">${d.emo}</span>
          <img src="${esc(d.img)}" alt="${esc(d.alt)}" decoding="async" draggable="false"></div>
        <div class="pairinfo">
          <div class="pn">${esc(d.n)}</div>
          <div class="pt">${esc(d.t)}</div>
          <div class="matchbar">
            <span>궁합</span>
            <div class="bar" role="img" aria-label="궁합 ${pct}퍼센트"><i style="width:${pct}%"></i></div>
            <span class="pct">${pct}%</span>
          </div>
        </div>
      </div>
      <p class="pairwhy">${esc(why)}</p>
      <div class="softline"><span aria-hidden="true">🥤</span><span>술 없이 간다면 <b>${esc(soft)}</b></span></div>
      <p class="credline">사진: <a href="${esc(d.c.p)}" target="_blank" rel="noopener noreferrer">${esc(d.c.t)}</a>
        — ${esc(d.c.a)}, <a href="${esc(d.c.lu)}" target="_blank" rel="noopener noreferrer">${esc(d.c.l)}</a> (자른 이미지)</p>
    </div>`;
}

function mapRow(icon, title, place, query){
  return `<a class="store" href="${esc(mapUrl(query))}" target="_blank" rel="noopener noreferrer">
    <span class="ic"><svg class="ico"><use href="#${icon}"/></svg></span>
    <span class="si"><span class="nm">${esc(title)}</span><span class="ds">${esc(place)}</span></span>
    <span class="go">지도 열기</span></a>`;
}

function altBtn(code, label){
  const f = FOOD[code];
  if (!f) return '';
  return `<button class="alt" type="button" data-code="${code}">
    <span class="ae" aria-hidden="true">${f.emo}</span>
    <span class="an"><b>${esc(f.n)}</b><span class="as">${esc(label)}</span></span></button>`;
}

  };
  $('#btn-copy').onclick  = copyResult;
  document.querySelectorAll('.alt').forEach(b => {
    b.onclick = () => {
      setHash(b.dataset.code + (strong ? 'X' : 'Y'));
      renderResult(b.dataset.code, strong);
    };
  });
}

async function copyResult(){
  if (!current) return;
  const f = FOOD[current.code], pick = current.strong ? f.x : f.y;
  const text = '[페어링 버디] 오늘의 추천 안주 — ' + f.n
    + ' (' + current.code.split('').map(c => AXIS_KO[c]).join('·') + ')\n'
    + '어울리는 술: ' + DRINK[pick.k].n + ' · 궁합 ' + pick.p + '%\n'
    + location.href;
  try{
    await navigator.clipboard.writeText(text);
    toast('결과를 복사했어요');
  }catch{
    toast('복사가 막혀 있어요 — 주소를 직접 공유해 주세요');
  }
}

/* ─────────── 주소창 해시로 결과 공유 (#SRDH + X/Y) ─────────── */
let skipHash = false;
function setHash(v){
  skipHash = true;
  if (v) location.hash = v;
  else if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  setTimeout(() => { skipHash = false; }, 0);
}
function fromHash(){
  const h = decodeURIComponent(location.hash.replace('#', '')).toUpperCase();
  if (!/^[SM][RL][WD][HB][XY]$/.test(h)) return false;
  renderResult(h.slice(0, 4), h[4] === 'X');
  return true;
}
window.addEventListener('hashchange', () => {
  if (skipHash) return;
  if (!fromHash()) show('s-quiz');
});

$('#btn-result').onclick = () => {
  const a = answers();
  if (a.some(v => !v)) return;
  const code = a.slice(0, 4).join('');
  setHash(code + a[4]);
  renderResult(code, a[4] === 'X');
};

refresh();
fromHash();
</script>
